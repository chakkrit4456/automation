# Nginx on the Debian host, in front of the Docker containers.
# 1. Replace app.example.com / n8n.example.com with your domains.
# 2. sudo cp deploy/nginx/ai-social.conf /etc/nginx/sites-available/ai-social
#    sudo ln -s /etc/nginx/sites-available/ai-social /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# 3. sudo certbot --nginx -d app.example.com -d n8n.example.com

server {
    listen 80;
    server_name app.example.com;

    client_max_body_size 600m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Rendering and uploading a video can take several minutes.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}

server {
    listen 80;
    server_name n8n.example.com;

    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 900s;
    }
}
